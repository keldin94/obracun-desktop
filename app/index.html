function blankData(){return {projects:[],items:[],entries:[],proofs:[],selectedProject:null,selectedMonth:ym(),selectedHalf:1,schemaVersion:3};}
function migrateState(source){
 if(!source || !Array.isArray(source.projects))return blankData();
 const data={...blankData(),...source};
 if(data.schemaVersion>=3)return data;
 if(data.schemaVersion>=2){
   data.items=(data.items||[]).map(item=>({...item,group:window.OBR_ENGINEERING.groupForPosition({code:item.code,name:item.name,group:item.group})}));
   data.schemaVersion=3;return data;
 }
 const sampleProjects=new Set(data.projects.filter(p=>p.name==='Ogledni projekt').map(p=>p.id));
 const samples=new Set((data.items||[]).filter(i=>sampleProjects.has(i.projectId)&&[
  ['1.01','Opaž AB plošče'],['1.02','Opaž AB nosilcev'],['1.03','Opaž robov plošče'],
  ['2.01','Betoniranje AB plošče'],['3.01','Vgradnja armature B500B']
 ].some(([code,name])=>i.code===code && i.name===name)).map(i=>i.id));
 data.items=(data.items||[]).filter(i=>!samples.has(i.id));
 data.entries=(data.entries||[]).filter(e=>!samples.has(e.itemId));
 data.proofs=(data.proofs||[]).filter(f=>!samples.has(f.itemId));
 data.projects=data.projects.filter(p=>!sampleProjects.has(p.id)||data.items.some(i=>i.projectId===p.id)||data.entries.some(e=>e.projectId===p.id)||data.proofs.some(f=>f.projectId===p.id))

 if(!data.projects.some(p=>p.id===data.selectedProject))data.selectedProject=data.projects[0]?.id||null;
 data.items=(data.items||[]).map(item=>({...item,group:window.OBR_ENGINEERING.groupForPosition({code:item.code,name:item.name,group:item.group})}));

}

const normNum=(v)=>{if(typeof v==='number')return v;const s=String(v??'').trim().replace(/\s|€/g,'');if(!s)return 0;let x=s;if(s.includes(',')&&s.includes('.'))x=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))x=s.replace(',','.');const n=Number(x);return Number.isFinite(n)?n:0;};
function expressionQuantity(raw){
 const str=String(raw||'').trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
 if(!str || !/^[\d.\s+*/()\-]+$/.test(str)) return null;
 const toks=str.match(/\d+(?:\.\d+)?|\.\d+|[()+*/-]/g);
 if(!toks||toks.join('')!==str.replace(/\s+/g,''))return null;
 let ix=0;
 function primary(){const t=toks[ix++];if(t==='-')return -primary();if(t==='+')return primary();if(t==='('){let v=sum();if(toks[ix++]!==')')throw 0;return v;}const n=Number(t);if(!Number.isFinite(n))throw 0;return n;}
 function product(){let n=primary();while(toks[ix]==='*'||toks[ix]==='/'){const op=toks[ix++];const x=primary();n=op==='*'?n*x:n/x;}return n;}
 function sum(){let n=product();while(toks[ix]==='+'||toks[ix]==='-'){const op=toks[ix++];const x=product();n=op==='+'?n+x:n-x;}return n;}
 try {const v=sum();return ix===toks.length&&Number.isFinite(v)?Math.round(v*1e5)/1e5:null;}catch{return null;}
}
