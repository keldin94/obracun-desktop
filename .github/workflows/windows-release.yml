name: Build and release Windows + macOS Intel desktop app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: |
          go test ./...
          go vet ./...
      - name: Validate multi-company cloud client
        run: |
          node --check app/cloud.js
          python3 -m json.tool app/cloud-config.json >/dev/null
          test -s supabase/002_organizations.sql
      - name: Generate app icons for both systems
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'Pillow==11.3.0' 'CairoSVG==2.7.1'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cairosvg
          out=Path('branding')
          cairosvg.svg2png(url=str(out/'obracun-icon.svg'),write_to=str(out/'obracun-icon-1024.png'),output_width=1024,output_height=1024)
          image=Image.open(out/'obracun-icon-1024.png').convert('RGBA')
          image.save(out/'obracun-icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          image.save(out/'Obracun.icns',format='ICNS')
          PY
      - name: Embed shared icon into Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          GOBIN="$PWD/.tools" go install github.com/akavel/rsrc@v0.10.2
          ./.tools/rsrc -arch amd64 -ico branding/obracun-icon.ico -o rsrc_windows_amd64.syso
          test -s rsrc_windows_amd64.syso
      - name: Build Windows x64
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o Obracun-Windows.exe .
          test -s Obracun-Windows.exe
          sha256sum Obracun-Windows.exe > Obracun-Windows.exe.sha256
          mkdir -p windows-package
          cp Obracun-Windows.exe Obracun-Windows.exe.sha256 windows-package/
          echo 'Extract ZIP and launch Obracun-Windows.exe' > windows-package/PROCITAJ.txt
          (cd windows-package && zip -q -9 -r ../Obracun-Windows.zip .)
      - name: Build Windows setup installer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          VERSION="$(grep -E '^[[:space:]]*appVersion[[:space:]]*=' main.go | head -1 | cut -d '"' -f 2)"
          makensis -V3 -DAPP_VERSION="$VERSION" packaging/windows/installer.nsi
          test -s Obracun-Setup-Windows.exe
          sha256sum Obracun-Setup-Windows.exe > Obracun-Setup-Windows.exe.sha256
      - name: Build and package macOS Intel app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^[[:space:]]*appVersion[[:space:]]*=' main.go | head -1 | cut -d '"' -f 2)"
          test -n "$VERSION"
          mkdir -p Obracun.app/Contents/MacOS Obracun.app/Contents/Resources
          cp branding/Obracun.icns Obracun.app/Contents/Resources/Obracun.icns
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o Obracun.app/Contents/MacOS/Obracun .
          test -s Obracun.app/Contents/MacOS/Obracun
          file Obracun.app/Contents/MacOS/Obracun | grep -q 'Mach-O 64-bit x86_64'
          chmod 755 Obracun.app/Contents/MacOS/Obracun
          sed "s/__APP_VERSION__/$VERSION/g" packaging/macos/Info.plist > Obracun.app/Contents/Info.plist
          printf 'APPL????' > Obracun.app/Contents/PkgInfo
          cp Obracun.app/Contents/MacOS/Obracun Obracun-macOS-Intel
          sha256sum Obracun-macOS-Intel > Obracun-macOS-Intel.sha256
          cp packaging/macos/INSTALACIJA_MAC.txt .
          zip -q -9 -r -y Obracun-macOS-Intel.zip Obracun.app INSTALACIJA_MAC.txt
          unzip -tq Obracun-macOS-Intel.zip
      - name: Upload Mac app bundle for disk image
        uses: actions/upload-artifact@v4
        with:
          name: obracun-macos-bundle
          path: Obracun-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 5
      - name: Publish version to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^[[:space:]]*appVersion[[:space:]]*=' main.go | head -1 | cut -d '"' -f 2)"
          test -n "$VERSION"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; no assets overwritten"
            exit 0
          fi
          gh release create "v$VERSION" \
            Obracun-Windows.exe Obracun-Windows.exe.sha256 Obracun-Windows.zip \
            Obracun-Setup-Windows.exe Obracun-Setup-Windows.exe.sha256 \
            Obracun-macOS-Intel Obracun-macOS-Intel.sha256 Obracun-macOS-Intel.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OBRAČUN v$VERSION (Windows + macOS Intel)" \
            --notes "v0.2.1: Windows ima pravi Setup installer, Start Menu i deinstalaciju. Sljedeća ažuriranja koriste installer i ponovo otvaraju instaliranu verziju. macOS dobija ZIP i DMG aplikaciju; za automatski update drži .app u folderu s pravom upisa (npr. ~/Applications). Podaci ostaju lokalno. Nisu digitalno potpisani. Cloud i dalje zahtijeva backend."

  macos-dmg:
    needs: desktop-release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download built macOS app
        uses: actions/download-artifact@v4
        with:
          name: obracun-macos-bundle
      - name: Package native macOS disk image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p disk-image
          ditto -x -k Obracun-macOS-Intel.zip disk-image
          test -x disk-image/Obracun.app/Contents/MacOS/Obracun
          ln -s /Applications disk-image/Applications
          hdiutil create -volname "OBRAČUN" -srcfolder disk-image -ov -format UDZO Obracun-macOS-Intel.dmg
          hdiutil verify Obracun-macOS-Intel.dmg
          shasum -a 256 Obracun-macOS-Intel.dmg > Obracun-macOS-Intel.dmg.sha256
      - name: Add DMG to the same GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^[[:space:]]*appVersion[[:space:]]*=' main.go | head -1 | cut -d '"' -f 2)"
          gh release upload "v$VERSION" Obracun-macOS-Intel.dmg Obracun-macOS-Intel.dmg.sha256 --repo "$GITHUB_REPOSITORY"
